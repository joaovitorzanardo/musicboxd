name: Publish images

# Builds the api and web (nginx + SPA) images for linux/arm64 (t4g.small EC2,
# AD-11) on native arm64 runners and pushes them to GHCR on every push to main,
# then deploys the pushed sha tag to the EC2 host over SSM.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    # Cancel superseded builds only; a workflow-level group would also cancel an in-flight deploy.
    concurrency:
      group: publish-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./api
            dockerfile: ./api/Dockerfile
          - name: web
            # web/Dockerfile expects the repo root as build context.
            context: .
            dockerfile: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/musicboxd-${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: publish
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    # Serialize deploys; never cancel one mid-flight (would leave the host half-updated).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy on EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
          TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          PARAMS=$(jq -nc --arg cmd "cd /opt/musicboxd && ./deploy.sh $TAG"             '{commands: [$cmd], executionTimeout: ["900"]}')
          CMD_ID=$(aws ssm send-command             --instance-ids "$INSTANCE_ID"             --document-name AWS-RunShellScript             --timeout-seconds 600             --parameters "$PARAMS"             --query Command.CommandId --output text)

          # `aws ssm wait` gives up after ~100s; poll for up to 600s instead.
          # The invocation may not exist yet right after send-command, so errors just retry.
          STATUS=Pending
          for _ in $(seq 1 120); do
            if STATUS=$(aws ssm get-command-invocation                 --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"                 --query Status --output text); then
              case "$STATUS" in
                Pending | InProgress | Delayed) ;;
                *) break ;;
              esac
            else
              STATUS=Pending
            fi
            sleep 5
          done

          echo "Final status: $STATUS"
          echo "----- remote stdout -----"
          aws ssm get-command-invocation             --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"             --query StandardOutputContent --output text || true
          echo "----- remote stderr -----"
          aws ssm get-command-invocation             --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"             --query StandardErrorContent --output text || true

          [ "$STATUS" = Success ]
