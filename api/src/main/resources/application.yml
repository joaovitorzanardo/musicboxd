server:
  port: 8080
  # Trust the client IP nginx forwards; nginx overwrites X-Forwarded-For (deploy/nginx).
  forward-headers-strategy: native

spring:
  application:
    name: musicboxd-api

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    enabled: false

# AD-10 layer 2: named per-user limit policies, applied with @RateLimited(policy = "...").
musicboxd:
  rate-limit:
    policies:
      demo:
        capacity: 5
        refill-period: 1m
