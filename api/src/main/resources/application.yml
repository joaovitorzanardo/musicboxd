server:
  port: 8080
  # Trust the client IP nginx forwards; nginx overwrites X-Forwarded-For (deploy/nginx).
  forward-headers-strategy: native

spring:
  application:
    name: musicboxd-api
  cloud:
    aws:
      # The SES identity lives in us-east-1 (runbook-mbd-18). Static, so startup never asks IMDS for a region.
      region:
        static: us-east-1
  datasource:
    # Compose hands the api the same postgres.env the database reads (AD-11: secrets in env files on the host).
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:musicboxd}
    username: ${POSTGRES_USER:musicboxd}
    password: ${POSTGRES_PASSWORD:}
  flyway:
    # Boot's single Flyway is off: each module migrates its own schema (see db.ModuleFlyway).
    enabled: false

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    enabled: false

musicboxd:
  # AD-10 layer 2: named per-user limit policies, applied with @RateLimited(policy = "...").
  rate-limit:
    policies:
      demo:
        capacity: 5
        refill-period: 1m
      # MBD-23 (AD-10): anonymous auth endpoints are limited twice. *-per-email counts one account
      # (the email in the body, whichever IP sends it); *-per-ip stops one caller cycling emails.
      login-per-ip:
        capacity: 20
        refill-period: 15m
      login-per-email:
        capacity: 10
        refill-period: 15m
      # Every sign-up sends a verification email (SES cost), so per-IP is the tight one.
      register-per-ip:
        capacity: 10
        refill-period: 1h
      register-per-email:
        capacity: 3
        refill-period: 1h
      # MBD-18 resend. Per IP as before; per email bounds what one inbox can be sent from any IPs.
      verification-email-per-ip:
        capacity: 3
        refill-period: 15m
      verification-email-per-email:
        capacity: 5
        refill-period: 24h
  auth:
    # Base64 of >= 32 random bytes (openssl rand -base64 32), from /etc/musicboxd/api.env.
    # No default on purpose: the api refuses to start without it.
    jwt-secret: ${MUSICBOXD_JWT_SECRET:}
    access-token-ttl: 15m
    # MBD-19: opaque, rotated on every use; a rotated-out token still works for `grace` (AD-8).
    refresh-token:
      ttl: 30d
      grace: 10s
  # MBD-21: promotes this account to STAFF on every start (afterMigrate callback). Optional;
  # the account must already exist (runbook-mbd-21-staff-bootstrap.md). Removing it does not demote.
  bootstrap-staff-email: ${MUSICBOXD_BOOTSTRAP_STAFF_EMAIL:}
  verification:
    # No defaults: the api refuses to start without them (/etc/musicboxd/api.env, runbook-mbd-18).
    link-base-url: ${MUSICBOXD_PUBLIC_BASE_URL:}
    mail-from: ${MUSICBOXD_MAIL_FROM:}
    ttl: 24h
