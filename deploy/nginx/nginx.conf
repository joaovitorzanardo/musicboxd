server {
    listen 80;
    server_name _;

    # SPA static assets, built by web/Dockerfile into /usr/share/nginx/html.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Single origin for SPA + API (AD-8): the browser only ever talks to
    # nginx; nginx proxies API calls to the api service on the internal
    # Docker network. api's own paths already start with /api/v1 (AD-7),
    # so the prefix is preserved as-is.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
