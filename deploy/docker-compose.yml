services:
  api:
    build:
      context: ../api
    restart: on-failure
    environment:
      POSTGRES_DB: musicboxd
      POSTGRES_USER: musicboxd
      POSTGRES_PASSWORD: musicboxd
      # Local-dev-only signing key (Base64 of a fixed 40-byte string); production reads
      # MUSICBOXD_JWT_SECRET from /etc/musicboxd/api.env (runbook-mbd-17-auth.md).
      MUSICBOXD_JWT_SECRET: bG9jYWwtZGV2LWp3dC1zZWNyZXQtbmV2ZXItdXNlLWluLXByb2QhIQ==
      # Local dev: verification emails are logged, not sent (docker compose logs api).
      SPRING_CLOUD_AWS_SES_ENABLED: "false"
      MUSICBOXD_MAIL_FROM: no-reply@localhost
      MUSICBOXD_PUBLIC_BASE_URL: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    # No ports published: reached only through nginx's proxy (AD-11).
    healthcheck:
      # No wget/curl in eclipse-temurin's minimal Ubuntu runtime image; bash's
      # /dev/tcp is used instead to check the port is accepting connections.
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8080']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:18
    restart: on-failure
    # Local-dev-only credentials, intentionally hardcoded; no Postgres port is published.
    # deploy.sh copies this file to the host with the rest of deploy/, but every host
    # script uses docker-compose.prod.yml, which reads /etc/musicboxd/postgres.env (AD-11).
    environment:
      POSTGRES_DB: musicboxd
      POSTGRES_USER: musicboxd
      POSTGRES_PASSWORD: musicboxd
    volumes:
      # Postgres 18+ images key data dirs by major version under a single
      # mount at /var/lib/postgresql (not .../data) -- see
      # https://github.com/docker-library/postgres/pull/1259.
      - postgres_data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    # No ports published: Postgres is reachable only on the internal
    # Docker network (AD-11).

  nginx:
    build:
      # Root context so the Dockerfile can COPY both web/ and
      # deploy/nginx/nginx.conf (see web/Dockerfile).
      context: ..
      dockerfile: web/Dockerfile
    restart: on-failure
    ports:
      - '80:80'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data:
