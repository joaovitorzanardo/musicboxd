# Production stack. Run on the EC2 host from /opt/musicboxd with:
#   docker compose --env-file /etc/musicboxd/stack.env -f docker-compose.prod.yml up -d
# `name:` pins the project (and so the volume names) regardless of the directory compose runs from.
name: musicboxd

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER must be set in /etc/musicboxd/stack.env}/musicboxd-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    # postgres.env: DB name and credentials shared with postgres; api.env: MUSICBOXD_JWT_SECRET (MBD-17).
    env_file:
      - ${MUSICBOXD_ENV_DIR:-/etc/musicboxd}/postgres.env
      - ${MUSICBOXD_ENV_DIR:-/etc/musicboxd}/api.env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    # No ports published: reached only through nginx (AD-11).
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8080']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:18
    restart: unless-stopped
    logging: *default-logging
    env_file: ${MUSICBOXD_ENV_DIR:-/etc/musicboxd}/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    # No ports published (AD-11).

  nginx:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER must be set in /etc/musicboxd/stack.env}/musicboxd-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set in /etc/musicboxd/stack.env}
      NGINX_ENVSUBST_FILTER: DOMAIN
    volumes:
      - ./nginx/nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  # Never started by `up`; used via `docker compose run --rm certbot ...`.
  certbot:
    image: certbot/certbot:latest
    profiles: [tools]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot

networks:
  internal:

volumes:
  postgres_data:
  letsencrypt:
  certbot_www:
